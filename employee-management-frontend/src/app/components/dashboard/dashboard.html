<div class="container">
  <div class="header">
    <h1>👥 Employee Management System</h1>
    <button class="logout-btn" (click)="logout()">Logout</button>
  </div>

  <div class="form-section">
    <h2>Add New Employee</h2>
    <div class="form-group">
      <label>Name</label>
      <input type="text" [(ngModel)]="name" placeholder="Enter name">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="Enter email">
    </div>
    <div class="form-group">
      <label>Department</label>
      <input type="text" [(ngModel)]="department" placeholder="Enter department">
    </div>
    <div class="form-group">
      <label>Salary</label>
      <input type="number" [(ngModel)]="salary" placeholder="Enter salary">
    </div>
    <button (click)="addEmployee()">Add Employee</button>
  </div>

  <div class="employees-section">
    <h2>Employees List</h2>
    <p *ngIf="employees.length === 0">No employees yet.</p>
    <div class="employee-card" *ngFor="let emp of employees">
      <div class="employee-info">
        <p><strong>{{ emp.name }}</strong></p>
        <p>Email: {{ emp.email }}</p>
        <p>Department: {{ emp.department }}</p>
        <p>Salary: ${{ emp.salary }}</p>
      </div>
      <button class="delete-btn" (click)="deleteEmployee(emp.id!)">Delete</button>
    </div>
  </div>
</div>
